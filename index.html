<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Expense Tracker</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#17302b;--mute:#5d726c;--line:#d5e0dc;--inc:#1f8a5b;--exp:#c2410c;--bal:#17302b;--accent:#0f766e}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:1.8rem}
.sub{margin:0 0 20px;color:var(--mute)}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.box small{color:var(--mute);font-size:.9rem}
.box strong{display:block;font-size:1.7rem;margin-top:4px;word-break:break-word}
#inc{color:var(--inc)}#exp{color:var(--exp)}#bal{color:var(--bal)}
.box.balance{background:var(--ink)}.box.balance small{color:#a9c4bc}.box.balance #bal{color:#fff}
.main{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
h2{margin:0 0 12px;font-size:1.15rem}
label{display:block;font-size:.9rem;font-weight:600;margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--exp);font-size:.82rem;min-height:1em;margin-top:2px}
.bad{border-color:var(--exp)}
.add{width:100%;margin-top:14px;padding:11px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.add:hover{background:#0b5f59}
.msg{display:none;margin-top:12px;padding:10px;border-radius:6px;background:#dcf3e8;color:#14684a;font-size:.92rem}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters button{padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:20px;font:inherit;cursor:pointer}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.93rem}
th{color:var(--mute);font-weight:600}
.tag{padding:2px 9px;border-radius:12px;font-size:.8rem;font-weight:600}
.tag.Income{background:#dcf3e8;color:var(--inc)}.tag.Expense{background:#fde5d8;color:var(--exp)}
.amt.Income{color:var(--inc)}.amt.Expense{color:var(--exp)}
.del{border:1px solid var(--exp);color:var(--exp);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:.85rem}
.del:hover{background:var(--exp);color:#fff}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
@media(max-width:820px){.main{grid-template-columns:1fr}}
@media(max-width:560px){.dash{grid-template-columns:1fr}h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Personal Expense Tracker</h1>
  <p class="sub">Track your daily income and expenses.</p>

  <section class="dash" aria-label="Summary">
    <div class="box"><small>Total Income</small><strong id="inc">৳0.00</strong></div>
    <div class="box"><small>Total Expenses</small><strong id="exp">৳0.00</strong></div>
    <div class="box balance"><small>Current Balance</small><strong id="bal">৳0.00</strong></div>
  </section>

  <div class="main">
    <section class="box">
      <h2>Add Transaction</h2>
      <form id="form" novalidate>
        <label for="title">Transaction Title</label>
        <input id="title" type="text" placeholder="e.g. Lunch" maxlength="60">
        <div class="err" id="e-title"></div>

        <label for="amount">Amount</label>
        <input id="amount" type="number" step="0.01" min="0" placeholder="0.00">
        <div class="err" id="e-amount"></div>

        <label for="type">Transaction Type</label>
        <select id="type">
          <option value="">Select type</option>
          <option>Income</option>
          <option>Expense</option>
        </select>
        <div class="err" id="e-type"></div>

        <label for="category">Category</label>
        <select id="category">
          <option value="">Select category</option>
          <option>Food</option><option>Shopping</option><option>Transport</option>
          <option>Salary</option><option>Bills</option><option>Education</option>
          <option>Health</option><option>Entertainment</option><option>Other</option>
        </select>
        <div class="err" id="e-category"></div>

        <label for="date">Date</label>
        <input id="date" type="date">
        <div class="err" id="e-date"></div>

        <button class="add" type="submit">Add Transaction</button>
        <div class="msg" id="msg" role="status"></div>
      </form>
    </section>

    <section class="box">
      <h2>Transaction History</h2>
      <div class="filters" id="filters">
        <button data-f="All" class="on">All Transactions</button>
        <button data-f="Income">Income</button>
        <button data-f="Expense">Expenses</button>
      </div>
      <div class="tw">
        <table>
          <thead><tr><th>Title</th><th>Amount</th><th>Category</th><th>Type</th><th>Date</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" style="display:none">No transactions found. Add your first one!</div>
    </section>
  </div>
</div>

<script>
const KEY = "expense_tracker_transactions";
let txs = [];
let filter = "All";
try { txs = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { txs = []; }

const $ = id => document.getElementById(id);
const money = n => "৳" + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(txs)); } catch (e) {} };
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render() {
  const inc = txs.filter(t => t.type === "Income").reduce((s, t) => s + t.amount, 0);
  const exp = txs.filter(t => t.type === "Expense").reduce((s, t) => s + t.amount, 0);
  $("inc").textContent = money(inc);
  $("exp").textContent = money(exp);
  $("bal").textContent = money(inc - exp);

  const list = txs.filter(t => filter === "All" || t.type === filter)
                  .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  $("rows").innerHTML = list.map(t => `
    <tr>
      <td>${esc(t.title)}</td>
      <td class="amt ${t.type}">${t.type === "Income" ? "+" : "−"}${money(t.amount)}</td>
      <td>${esc(t.category)}</td>
      <td><span class="tag ${t.type}">${t.type}</span></td>
      <td>${t.date}</td>
      <td><button class="del" data-id="${t.id}" aria-label="Delete ${esc(t.title)}">Delete</button></td>
    </tr>`).join("");
  $("empty").style.display = list.length ? "none" : "block";
  $("empty").textContent = txs.length ? "No " + filter.toLowerCase() + " transactions found." : "No transactions found. Add your first one!";
}

function setErr(field, text) {
  $("e-" + field).textContent = text;
  $(field).classList.toggle("bad", !!text);
}

function validate() {
  const title = $("title").value.trim();
  const amount = $("amount").value.trim();
  const type = $("type").value, category = $("category").value, date = $("date").value;
  let ok = true;
  setErr("title", title ? "" : "Please enter a title."); if (!title) ok = false;
  const n = Number(amount);
  const amtMsg = amount === "" ? "Please enter an amount." : (!isFinite(n) || n <= 0 ? "Amount must be greater than 0." : "");
  setErr("amount", amtMsg); if (amtMsg) ok = false;
  setErr("type", type ? "" : "Please select a type."); if (!type) ok = false;
  setErr("category", category ? "" : "Please select a category."); if (!category) ok = false;
  setErr("date", date ? "" : "Please select a date."); if (!date) ok = false;
  return ok ? {title, amount: Math.round(n * 100) / 100, type, category, date} : null;
}

let msgTimer;
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const data = validate();
  if (!data) return;
  txs.push({id: Date.now(), ...data});
  save(); render();
  $("form").reset();
  $("date").value = new Date().toISOString().slice(0, 10);
  const m = $("msg");
  m.textContent = "Transaction added successfully!";
  m.style.display = "block";
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => m.style.display = "none", 3000);
});

$("rows").addEventListener("click", e => {
  const b = e.target.closest(".del");
  if (!b) return;
  txs = txs.filter(t => String(t.id) !== b.dataset.id);
  save(); render();
});

$("filters").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("on", x === b));
  render();
});

$("date").value = new Date().toISOString().slice(0, 10);
render();
</script>
</body>
</html>
